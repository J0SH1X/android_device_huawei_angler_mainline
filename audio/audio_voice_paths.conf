# Nexus 6P (angler): circuit-switched voice through the ADSP (q6voice "CS-Voice").
# Read by the AIDL primary module (VoiceCall): the call runs while the CS-Voice PCM is held open,
# routing is plain mixer settings. Amps: Left = top (earpiece when "Receiver Switch" is on),
# Right = bottom loudspeaker. Voice is mono on the left I2S channel.
card 0
device 1

[common]
QUAT_MI2S_RX Voice Mixer CS-Voice=1
# TODO: WCD9330 mics. Until then the amps' IV-sense port is the (placeholder) TX source.
CS-Voice Capture Mixer QUAT_MI2S_TX=1
Left DAI IN MUX=Left
Right DAI IN MUX=Left

[earpiece]
Right Amp Switch=0
Left Amp Switch=1
Receiver Switch=1
Left Speaker Volume=8

[speaker]
Receiver Switch=0
Left Speaker Volume=20
Left Amp Switch=1
Right Amp Switch=1

[headset]
Receiver Switch=0
Left Speaker Volume=20
Left Amp Switch=1
Right Amp Switch=1

[off]
QUAT_MI2S_RX Voice Mixer CS-Voice=0
CS-Voice Capture Mixer QUAT_MI2S_TX=0
Receiver Switch=0
Left Speaker Volume=20
Left Amp Switch=1
Right Amp Switch=1
Left DAI IN MUX=Left
Right DAI IN MUX=Right
